name: photobooth
description: "Photobooth cho một sự kiện, chạy trên iPad. Dùng lại camera, clip Live và máy chủ chia sẻ của Lensly."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Lensly's native camera layer (copied from Lensly packages/film_camera, + landscape mode).
  film_camera:
    path: packages/film_camera
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  qr: ^3.0.2
  image_picker: ^1.2.4
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  shaders:
    - shaders/film.frag
    - shaders/skin.frag
  # Playfair Display + Be Vietnam Pro (OFL), bundled so google_fonts never needs the network.
  assets:
    - google_fonts/
